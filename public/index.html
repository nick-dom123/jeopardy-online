<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy Game Platform</title>
<style>
  :root {
    --bg-dark: #121212;
    --text-main: #ffffff;
    --text-muted: #a0a0a0;
    --accent: #ffffff;
    --tile-bg: rgba(255, 255, 255, 0.05);
    --tile-hover: rgba(255, 255, 255, 0.1);
    --tile-played: rgba(255, 255, 255, 0.02);
    --glow-blue: #3b82f6;
    --glow-pink: #ec4899;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: "";
    position: fixed;
    bottom: -20vh;
    left: -10vw;
    width: 120vw;
    height: 80vh;
    background: radial-gradient(ellipse at bottom, rgba(59, 130, 246, 0.4) 0%, rgba(236, 72, 153, 0.2) 40%, transparent 70%);
    z-index: -1;
    pointer-events: none;
    filter: blur(50px);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 3rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; cursor: pointer; }
  
  nav { display: flex; gap: 1.5rem; }
  .tab { 
    background: none; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: color 0.2s; 
  }
  .tab:hover, .tab.active { color: var(--text-main); }
  
  .btn {
    background: var(--text-main); color: var(--bg-dark); border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn-outline {
    background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.05); }

  main { flex: 1; padding: 3rem; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1600px; margin: 0 auto; }

  .view { display: none; width: 100%; animation: fadeIn 0.3s ease; }
  .view.active { display: block; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .hero { text-align: center; margin-bottom: 4rem; }
  .hero h1 { font-size: 3.5rem; letter-spacing: -1.5px; margin-bottom: 1rem; }
  .hero p { color: var(--text-muted); font-size: 1.1rem; }

  /* Game Layout - Sidebar & Board */
  .game-layout {
    display: flex;
    gap: 2rem;
    width: 100%;
    align-items: flex-start;
  }

  .board-main {
    flex: 1;
    min-width: 0;
  }

  .sidebar {
    width: 320px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 1.5rem;
    position: sticky;
    top: 100px;
  }

  .sidebar h3 {
    margin-bottom: 1.5rem;
    font-size: 1.2rem;
    text-align: center;
    color: var(--text-muted);
  }

  .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .jeopardy-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.75rem;
    width: 100%;
  }

  .category-header {
    background: rgba(255,255,255,0.1);
    padding: 1rem 0.5rem;
    text-align: center;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.9rem;
    border-radius: 8px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile {
    background: var(--tile-bg);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    aspect-ratio: 8/3; 
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    color: #eab308;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .tile:hover:not(.played) { background: var(--tile-hover); transform: scale(1.02); }
  .tile.played { background: var(--tile-played); color: rgba(255,255,255,0.1); cursor: default; transform: none; border: 1px solid transparent; }

  /* Scores */
  .scoreboard {
    display: flex; flex-direction: column; gap: 1rem;
  }
  
  .player-card {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 12px; text-align: center; width: 100%;
  }
  .player-name { font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; font-size: 1.1rem;}
  .player-score { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
  .score-controls { display: flex; gap: 0.5rem; justify-content: center; }
  .score-btn {
    background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: background 0.2s;
  }
  .score-btn:hover { background: rgba(255,255,255,0.2); }
  .score-btn.add { color: #4ade80; }
  .score-btn.sub { color: #f87171; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
  .modal-content {
    background: #1a1a1a; padding: 4rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 800px; width: 90%; text-align: center; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  .clue-value { color: #eab308; font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
  .clue-text { font-size: 2.2rem; font-weight: 700; line-height: 1.3; margin-bottom: 2rem; }
  .question-text { font-size: 1.8rem; color: #4ade80; display: none; margin-bottom: 2rem; font-style: italic; }
  .modal-actions { display: flex; justify-content: center; gap: 1rem; }
  
  .close-modal { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; opacity: 0.5; }
  .close-modal:hover { opacity: 1; }

  .quick-award { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); display: none; }
  .quick-award h4 { margin-bottom: 1rem; color: var(--text-muted); }
  .qa-players { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

  @media (max-width: 1024px) {
    .game-layout { flex-direction: column; }
    .sidebar { width: 100%; top: 0; }
    .scoreboard { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .player-card { width: auto; min-width: 200px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="switchView('home')">Jeopardy Host</div>
  <nav id="main-nav"></nav>
  <div></div>
</header>

<main>
  <!-- Home View -->
  <div id="view-home" class="view active">
    <div class="hero">
      <h1>Host your game night</h1>
      <p>Select a group above to start playing.</p>
    </div>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 400px; margin: 0 auto;">
      <h3>Quick Setup</h3>
      <input type="text" id="new-player-input" placeholder="Enter player/team name" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white;">
      <button class="btn" style="width: 100%" onclick="addPlayer()">Add Player</button>
      <div id="player-setup-list" style="width: 100%; margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;"></div>
    </div>
  </div>

  <!-- Game View -->
  <div id="view-game" class="view">
    <div class="game-layout">
      <div class="board-main">
        <div class="board-header">
          <div>
            <h2 id="game-title" style="font-size: 2rem;">Group 1</h2>
            <p id="game-subtitle" style="color: var(--text-muted);">Board 1 (100 - 500)</p>
          </div>
          <button id="next-board-btn" class="btn" onclick="nextBoard()">Next Board</button>
        </div>

        <div class="jeopardy-grid" id="jeopardy-grid">
          <!-- Grid injected via JS -->
        </div>
      </div>
      
      <div class="sidebar">
        <h3>Live Scores</h3>
        <div class="scoreboard" id="scoreboard">
          <!-- Scores injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- End Game View -->
  <div id="view-end" class="view">
    <div class="hero">
      <h1>Game Over!</h1>
      <p>Final Standings</p>
    </div>
    <div class="scoreboard" id="final-scoreboard" style="flex-direction: row; flex-wrap: wrap; justify-content: center;">
    </div>
  </div>
</main>

<!-- Clue Modal -->
<div class="modal-overlay" id="clue-modal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeClue()">×</button>
    <div class="clue-value" id="modal-val"></div>
    <div class="clue-text" id="modal-clue"></div>
    <div class="question-text" id="modal-question"></div>
    
    <div class="modal-actions">
      <button class="btn" id="reveal-btn" onclick="revealQuestion()">Reveal Answer</button>
      <button class="btn btn-outline" id="clear-buzzer-btn" style="display: none; border-color: #f87171; color: #f87171;" onclick="clearBuzzers()">Clear Buzzers</button>
      <button class="btn btn-outline" onclick="closeClue()">Close</button>
    </div>

    <div class="quick-award" id="quick-award">
      <h4>Award Points (<span id="qa-val"></span>)</h4>
      <div class="qa-players" id="qa-players"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const state = {
    groups: [
      { id: 'g1', name: 'Group 1' }
    ],
    players: [],
    activeGroupId: null,
    activeBoard: 1, 
    playedTiles: new Set(),
    currentTile: null
  };

  const boardsData = [
    {
      boardNumber: 1,
      title: "Board 1 (100 - 500)",
      categories: [
        {
          name: "UNITED KINGDOM",
          clues: [
            { val: 100, clue: "Located along the River Thames, this iconic clock tower at the north end of the Houses of Parliament is famous for its massive bell.", answer: "The Big Ben" },
            { val: 200, clue: "Perched atop Castle Rock, this historic fortress dominates the skyline of Scotland's capital city.", answer: "The Edinburgh Castle" },
            { val: 300, clue: "What country speaks the Celtic language", answer: "Wales" },
            { val: 400, clue: "Stretching across the Scottish Highlands, this legendary freshwater lake is famous for its mythical aquatic monster, 'Nessie.'", answer: "Loch Ness" },
            { val: 500, clue: "Designed by Sir Christopher Wren to replace a cathedral destroyed in the Great Fire of 1666, this famous London landmark features a massive 365-foot dome.", answer: "St. Paul’s Cathedral" }
          ]
        },
        {
          name: "AN APPLE A DAY",
          clues: [
            { val: 100, clue: "Introduced in 1998 with an iconic translucent bondi-blue casing, this desktop computer launched a new era for Steve Jobs' company.", answer: "Apple iMac" },
            { val: 200, clue: "Originating in Australia in 1868, this tart, bright green apple variety is named after the gardener who accidentally cultivated it.", answer: "Granny Smith" },
            { val: 300, clue: "The official nickname of New York City, popularized in the 1920s by sports writer John J. Fitz Gerald.", answer: "The Big Apple" },
            { val: 400, clue: "In Minecraft, what is the Enchanted Golden Apple also known as", answer: "Notch Apple" },
            { val: 500, clue: "Founded in London in 1968 by the Beatles, this multimedia corporation was famously used to release their iconic album Abbey Road.", answer: "Apple Corps" }
          ]
        },
        {
          name: "CELEB ALTER EGO’S",
          clues: [
            { val: 100, clue: "Before becoming a pop icon this artist went by her real name, Stefani Germanotta.", answer: "Lady Gaga" },
            { val: 200, clue: "Before dominating the pop charts, this singer was born Robyn Fenty, a name she now uses for her billion-dollar beauty and fashion empire.", answer: "Rihanna" },
            { val: 300, clue: "Before taking over Hollywood under a single moniker, this action star was born Eric Marlon Bishop and started his career doing stand-up comedy.", answer: "Jamie Foxx" },
            { val: 400, clue: "In 2008, Beyoncé released a double album introducing this fierce, confident onstage alter ego created to help her overcome her shyness during performances.", answer: "Sasha Fierce" },
            { val: 500, clue: "Known for his roles in very popular action movies, this actor's real name is Mark Sinclair, though he is best known globally by a name inspired by a type of fuel.", answer: "Vin Diesel" }
          ]
        },
        {
          name: "HOMOPHOBES… I MEAN HOMOPHONES",
          clues: [
            { val: 100, clue: "The color of the sky on a clear day, and what the wind did to the leaves during a storm.", answer: "Blue and Blew" },
            { val: 200, clue: "A noble armored warrior from the Middle Ages, and the period of darkness between sunset and sunrise.", answer: "Knight and Night" },
            { val: 300, clue: "An aromatic herb commonly paired with lamb, and the passage of time or a specific period in history.", answer: "Thyme and Time" },
            { val: 400, clue: "To cry out loudly in sorrow, and a massive ocean mammal with blowholes and baleen", answer: "Wail and Whale" },
            { val: 500, clue: "A person who designs or builds something, and a formal religious ceremony or custom.", answer: "Wright or Rite" }
          ]
        },
        {
          name: "3 LETTER WORDS",
          clues: [
            { val: 100, clue: "A common salty snack eaten frequently with beer.", answer: "Nut" },
            { val: 200, clue: "A sly, canine predator known for its bushy tail and red fur.", answer: "Fox" },
            { val: 300, clue: "The nickname for a coffee which is also a common English first name.", answer: "Joe" },
            { val: 400, clue: "A three-letter word for a mischievous sprite in folklore, or a tiny creature in fantasy games.", answer: "Imp" },
            { val: 500, clue: "A popular white fish often batter-fried and served alongside chips.", answer: "Cod" }
          ]
        }
      ]
    },
    {
      boardNumber: 2,
      title: "Board 2 (200 - 1000)",
      categories: [
        {
          name: "WHO KNOWS NICK BETTER",
          clues: [
            { val: 200, clue: "Who did I go to Japan with", answer: "Adrian" },
            { val: 400, clue: "What year was I diagnosed with ADHD", answer: "2024" },
            { val: 600, clue: "What surgery have I put off multiple times", answer: "Tonsils, Adnoids & Septoplasty" },
            { val: 800, clue: "What is the name of my favourite alcohol", answer: "Woodford Reserve" },
            { val: 1000, clue: "What is my favourite plant", answer: "Thai Constellation" }
          ]
        },
        {
          name: "WHO SAID IT (THE OFFICE)",
          clues: [
            { val: 200, clue: "I am fast. To give you a reference point, I'm somewhere between a snake and a mongoose. And a panther.", answer: "Dwight" },
            { val: 400, clue: "I want you to rub butter on my foot… Pam, please? I have Country Crock.", answer: "Michael" },
            { val: 600, clue: "I feel God in this Chili's tonight.", answer: "Pam" },
            { val: 800, clue: "Boy have you done lost your mind, 'cause I'll help you find it!", answer: "Stanley" },
            { val: 1000, clue: "I don’t talk trash, I talk smack. They’re totally different. Trash talk is hypothetical", answer: "Kelly" }
          ]
        },
        {
          name: "1 HIT WONDERS",
          clues: [
            { val: 200, clue: "Belgian-Australian musician Gotye topped global charts in 2011 with this breakup anthem featuring singer Kimbra.", answer: "Somebody That I Used to Know" },
            { val: 400, clue: "This 1996 viral dance hit by Spanish pop duo Los del Río spent 14 weeks at No. 1 and came with its own signature arm-and-hip line dance.", answer: "The Macarena" },
            { val: 600, clue: "Released in 1999 by Lou Bega, this high-energy track famously listed off a lineup of women.", answer: "Mambo Number 5" },
            { val: 800, clue: "Recorded in a single afternoon by the British band The Buggles, this 1979 track made history as the very first music video ever broadcast on MTV in 1981.", answer: "Video Killed the Radio Star" },
            { val: 1000, clue: "This 1982 Celtic-rock chart-topper by Dexys Midnight Runners is famous for its fast-paced fiddle intro and overalls-and-dungarees music video.", answer: "Come on Eileen" }
          ]
        },
        {
          name: "BADLY EXPLAINED MOVIES",
          clues: [
            { val: 200, clue: "An awkward teenage girl moves to a rainy town, falls in love with a 100-year-old high school student who sparkles in sunlight, and ignores every red flag imaginable.", answer: "Twilight" },
            { val: 400, clue: "A billionaire weapons dealer gets kidnapped, builds a high-tech set of armour to escape, and decides his new life goal is flying around in his hot-rod armor.", answer: "Iron Man" },
            { val: 600, clue: "Four awkward British teenagers go on a holiday, consume absurd amounts of alcohol, fail miserably with girls, and embarrass themselves continuously.", answer: "The Inbetweeners" },
            { val: 800, clue: "A historian steals the Declaration of Independence just to read a secret map printed on the back that leads to a giant pile of buried gold.", answer: "National Treasure" },
            { val: 1000, clue: "A patriarch pisses off an entire town by dumping manure into a lake, prompting the EPA to trap the whole city.", answer: "The Simpsons Movie" }
          ]
        },
        {
          name: "THE MISSING “A”",
          clues: [
            { val: 200, clue: "The yellow center of a chicken egg, surrounded by the egg white.", answer: "Yolk" },
            { val: 400, clue: "The primary organ in the human body responsible for pumping blood through the circulatory system.", answer: "Heart" },
            { val: 600, clue: "You might call this liquid dairy product Milk, but when asked for its official spreadable byproduct you would say?", answer: "Butter" },
            { val: 800, clue: "This is the highest 3 digit number", answer: "999" },
            { val: 1000, clue: "It's the primary red pigment found in human red blood cells that carries oxygen.", answer: "Haemoglobin" }
          ]
        }
      ]
    }
  ];
  
  function init() {
    renderTabs();
    if(state.groups.length > 0) {
      startGame(state.groups[0].id);
    }
  }

  function renderTabs() {
    const nav = document.getElementById('main-nav');
    nav.innerHTML = state.groups.map(g => 
      `<button class="tab active" onclick="startGame('${g.id}')">${g.name}</button>`
    ).join('');
  }

  function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${viewId}`).classList.add('active');
  }

  // --- ONLINE MULTIPLAYER LOGIC --- //

  function addPlayer(presetName = null) {
    const input = document.getElementById('new-player-input');
    const name = presetName || input.value.trim();
    if(name) {
      const newPlayer = { id: 'p'+Date.now(), name, score: 0 };
      socket.emit('add_player', newPlayer); 
      input.value = '';
    }
  }

  socket.on('update_players', (serverPlayers) => {
    state.players = serverPlayers;
    renderPlayerSetup();
    renderScoreboard();
  });

  socket.on('buzzer_winner', (playerId) => {
    const winner = state.players.find(p => p.id === playerId);
    if (winner) {
      const questionText = document.getElementById('modal-question');
      questionText.style.display = 'block';
      questionText.style.color = '#eab308'; 
      questionText.innerText = `🚨 ${winner.name.toUpperCase()} BUZZED FIRST! 🚨`;
      
      document.getElementById('reveal-btn').style.display = 'none';
      document.getElementById('clear-buzzer-btn').style.display = 'inline-block';
    }
  });

  function clearBuzzers() {
    socket.emit('reset_buzzer'); 
    
    // Hide buzzer warning and reset reveal button
    document.getElementById('modal-question').style.display = 'none';
    document.getElementById('modal-question').innerText = '';
    document.getElementById('clear-buzzer-btn').style.display = 'none';
    document.getElementById('reveal-btn').style.display = 'inline-block';
  }

  // --- STANDARD GAME LOGIC --- //

  function renderPlayerSetup() {
    const list = document.getElementById('player-setup-list');
    list.innerHTML = state.players.map(p => 
      `<div style="display:flex; justify-content:space-between; background: rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 4px;">
        <span>${p.name}</span>
        <button style="background:none;border:none;color:#f87171;cursor:pointer;" onclick="removePlayer('${p.id}')">Remove</button>
      </div>`
    ).join('');
  }

  function removePlayer(id) {
    state.players = state.players.filter(p => p.id !== id);
    renderPlayerSetup();
    renderScoreboard();
    socket.emit('update_scores', state.players); 
  }

  function updateScore(playerId, amount) {
    const player = state.players.find(p => p.id === playerId);
    if(player) {
      player.score += amount;
      renderScoreboard();
      renderQuickAward();
      socket.emit('update_scores', state.players); 
    }
  }

  function renderScoreboard() {
    const html = state.players.map(p => `
      <div class="player-card">
        <div class="player-name">${p.name}</div>
        <div class="player-score" style="color: ${p.score < 0 ? '#f87171' : 'white'}">${p.score}</div>
        <div class="score-controls">
          <button class="score-btn sub" onclick="updateScore('${p.id}', ${state.activeBoard === 1 ? -100 : -200})">-</button>
          <button class="score-btn add" onclick="updateScore('${p.id}', ${state.activeBoard === 1 ? 100 : 200})">+</button>
        </div>
      </div>
    `).join('');
    
    document.getElementById('scoreboard').innerHTML = html;
  }

  function startGame(groupId) {
    state.activeGroupId = groupId;
    state.activeBoard = 1;
    state.playedTiles.clear();
    
    document.getElementById('game-title').innerText = "Jeopardy Game Night";
    updateBoardUI();
    switchView('game');
  }

  function nextBoard() {
    if(state.activeBoard === 1) {
      state.activeBoard = 2;
      updateBoardUI();
    } else {
      endGame();
    }
  }

  function endGame() {
    switchView('end');
    const sorted = [...state.players].sort((a,b) => b.score - a.score);
    const container = document.getElementById('final-scoreboard');
    container.innerHTML = sorted.map((p, i) => `
      <div class="player-card" style="width: 300px; margin: 0.5rem; border-color: ${i===0 ? '#eab308' : 'rgba(255,255,255,0.1)'};">
        <div style="color: ${i===0 ? '#eab308' : 'white'}; font-size: 1.5rem; margin-bottom: 0.5rem;">${i===0 ? '🏆 Winner' : '#'+(i+1)}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score}</div>
      </div>
    `).join('');
  }

  function updateBoardUI() {
    const currentBoard = boardsData[state.activeBoard - 1];
    document.getElementById('game-subtitle').innerText = currentBoard.title;
    document.getElementById('next-board-btn').innerText = state.activeBoard === 1 ? 'Next Board' : 'End Game';
    
    const grid = document.getElementById('jeopardy-grid');
    grid.innerHTML = '';

    currentBoard.categories.forEach(cat => {
      grid.innerHTML += `<div class="category-header">${cat.name}</div>`;
    });

    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 5; col++) {
        const cat = currentBoard.categories[col];
        const clueObj = cat.clues[row];
        const tileId = `b${state.activeBoard}-r${row+1}-c${col}`;
        const isPlayed = state.playedTiles.has(tileId);
        
        grid.innerHTML += `
          <div class="tile ${isPlayed ? 'played' : ''}" 
               id="${tileId}" 
               onclick="!this.classList.contains('played') && openClue('${tileId}', ${col}, ${row})">
            $${clueObj.val}
          </div>
        `;
      }
    }
    renderScoreboard();
  }

  function openClue(tileId, colIndex, rowIndex) {
    const currentBoard = boardsData[state.activeBoard - 1];
    const cat = currentBoard.categories[colIndex];
    const clueObj = cat.clues[rowIndex];
    
    state.currentTile = { id: tileId, val: clueObj.val, answer: clueObj.answer };
    
    document.getElementById('modal-val').innerText = `${cat.name} - $${clueObj.val}`;
    document.getElementById('modal-clue').innerText = clueObj.clue;
    
    const qText = document.getElementById('modal-question');
    qText.style.display = 'none';
    qText.innerText = '';
    
    document.getElementById('reveal-btn').style.display = 'inline-block';
    document.getElementById('clear-buzzer-btn').style.display = 'none';
    
    renderQuickAward();
    document.getElementById('quick-award').style.display = 'block';
    
    const modal = document.getElementById('clue-modal');
    modal.classList.add('active');
  }

  function revealQuestion() {
    if(!state.currentTile) return;
    const qText = document.getElementById('modal-question');
    qText.style.display = 'block';
    qText.style.color = '#4ade80';
    qText.innerText = `(${state.currentTile.answer})`;
    document.getElementById('reveal-btn').style.display = 'none';
    document.getElementById('clear-buzzer-btn').style.display = 'none';
  }

  function closeClue() {
    if(state.currentTile) {
      state.playedTiles.add(state.currentTile.id);
      document.getElementById(state.currentTile.id).classList.add('played');
    }
    document.getElementById('clue-modal').classList.remove('active');
    state.currentTile = null;
    
    socket.emit('reset_buzzer'); 
  }

  function renderQuickAward() {
    if(!state.currentTile) return;
    const val = state.currentTile.val;
    document.getElementById('qa-val').innerText = `$${val}`;
    const container = document.getElementById('qa-players');
    
    container.innerHTML = state.players.map(p => `
      <div style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); text-align: center;">
        <div style="font-weight: 600; margin-bottom: 0.25rem;">${p.name}</div>
        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem;">${p.score}</div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-outline" style="color: #f87171; padding: 0.25rem 0.5rem;" onclick="updateScore('${p.id}', ${-val})">-${val}</button>
          <button class="btn btn-outline" style="color: #4ade80; padding: 0.25rem 0.5rem;" onclick="updateScore('${p.id}', ${val})">+${val}</button>
        </div>
      </div>
    `).join('');
  }

  init();
</script>
</body>
</html>

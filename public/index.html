<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy Game Platform</title>
<style>
  :root {
    --bg-dark: #121212;
    --text-main: #ffffff;
    --text-muted: #a0a0a0;
    --accent: #ffffff;
    --tile-bg: rgba(255, 255, 255, 0.05);
    --tile-hover: rgba(255, 255, 255, 0.1);
    --tile-played: rgba(255, 255, 255, 0.02);
    --glow-blue: #3b82f6;
    --glow-pink: #ec4899;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: "";
    position: fixed;
    bottom: -20vh;
    left: -10vw;
    width: 120vw;
    height: 80vh;
    background: radial-gradient(ellipse at bottom, rgba(59, 130, 246, 0.4) 0%, rgba(236, 72, 153, 0.2) 40%, transparent 70%);
    z-index: -1;
    pointer-events: none;
    filter: blur(50px);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 3rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; cursor: pointer; }
  
  nav { display: flex; gap: 1.5rem; }
  .tab { 
    background: none; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: color 0.2s; 
  }
  .tab:hover, .tab.active { color: var(--text-main); }
  
  .btn {
    background: var(--text-main); color: var(--bg-dark); border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn-outline {
    background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.05); }

  main { flex: 1; padding: 3rem; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1600px; margin: 0 auto; }

  .view { display: none; width: 100%; animation: fadeIn 0.3s ease; }
  .view.active { display: block; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .hero { text-align: center; margin-bottom: 4rem; }
  .hero h1 { font-size: 3.5rem; letter-spacing: -1.5px; margin-bottom: 1rem; }
  .hero p { color: var(--text-muted); font-size: 1.1rem; }

  /* Game Layout - Sidebar & Board */
  .game-layout {
    display: flex;
    gap: 2rem;
    width: 100%;
    align-items: flex-start;
  }

  .board-main {
    flex: 1;
    min-width: 0;
  }

  .sidebar {
    width: 320px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 1.5rem;
    position: sticky;
    top: 100px;
  }

  .sidebar h3 {
    margin-bottom: 1.5rem;
    font-size: 1.2rem;
    text-align: center;
    color: var(--text-muted);
  }

  .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .jeopardy-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.75rem;
    width: 100%;
  }

  .category-header {
    background: rgba(255,255,255,0.1);
    padding: 1rem 0.5rem;
    text-align: center;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.9rem;
    border-radius: 8px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile {
    background: var(--tile-bg);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 8px;
    aspect-ratio: 8/3; 
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 700;
    color: #eab308;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .tile:hover:not(.played) { background: var(--tile-hover); transform: scale(1.02); }
  .tile.played { background: var(--tile-played); color: rgba(255,255,255,0.1); cursor: default; transform: none; border: 1px solid transparent; }

  /* Scores */
  .scoreboard {
    display: flex; flex-direction: column; gap: 1rem;
  }
  
  .player-card {
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; border-radius: 12px; text-align: center; width: 100%;
  }
  .player-name { font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; font-size: 1.1rem;}
  .player-score { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
  .score-controls { display: flex; gap: 0.5rem; justify-content: center; }
  .score-btn {
    background: rgba(255,255,255,0.1); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: background 0.2s;
  }
  .score-btn:hover { background: rgba(255,255,255,0.2); }
  .score-btn.add { color: #4ade80; }
  .score-btn.sub { color: #f87171; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
  .modal-content {
    background: #1a1a1a; padding: 4rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 800px; width: 90%; text-align: center; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  }
  .clue-value { color: #eab308; font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; }
  .clue-text { font-size: 2.2rem; font-weight: 700; line-height: 1.3; margin-bottom: 2rem; }
  .question-text { font-size: 1.8rem; color: #4ade80; display: none; margin-bottom: 2rem; font-style: italic; }
  .modal-actions { display: flex; justify-content: center; gap: 1rem; }
  
  .close-modal { position: absolute; top: 1.5rem; right: 1.5rem; background: none; border: none; color: white; font-size: 2rem; cursor: pointer; opacity: 0.5; }
  .close-modal:hover { opacity: 1; }

  .quick-award { margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); display: none; }
  .quick-award h4 { margin-bottom: 1rem; color: var(--text-muted); }
  .qa-players { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }

  @media (max-width: 1024px) {
    .game-layout { flex-direction: column; }
    .sidebar { width: 100%; top: 0; }
    .scoreboard { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .player-card { width: auto; min-width: 200px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="switchView('home')">Jeopardy Host</div>
  <nav id="main-nav"></nav>
  <div></div>
</header>

<main>
  <!-- Home View -->
  <div id="view-home" class="view active">
    <div class="hero">
      <h1>Host your game night</h1>
      <p>Select a group above to start playing.</p>
    </div>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem; max-width: 400px; margin: 0 auto;">
      <h3>Quick Setup</h3>
      <input type="text" id="new-player-input" placeholder="Enter player/team name" style="width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white;">
      <button class="btn" style="width: 100%" onclick="addPlayer()">Add Player</button>
      <div id="player-setup-list" style="width: 100%; margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;"></div>
    </div>
  </div>

  <!-- Game View -->
  <div id="view-game" class="view">
    <div class="game-layout">
      <div class="board-main">
        <div class="board-header">
          <div>
            <h2 id="game-title" style="font-size: 2rem;">Group 1</h2>
            <p id="game-subtitle" style="color: var(--text-muted);">Board 1 (100 - 500)</p>
          </div>
          <button id="next-board-btn" class="btn" onclick="nextBoard()">Next Board</button>
        </div>

        <div class="jeopardy-grid" id="jeopardy-grid">
          <!-- Grid injected via JS -->
        </div>
      </div>
      
      <div class="sidebar">
        <h3>Live Scores</h3>
        <div class="scoreboard" id="scoreboard">
          <!-- Scores injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- End Game View -->
  <div id="view-end" class="view">
    <div class="hero">
      <h1>Game Over!</h1>
      <p>Final Standings</p>
    </div>
    <div class="scoreboard" id="final-scoreboard" style="flex-direction: row; flex-wrap: wrap; justify-content: center;">
    </div>
  </div>
</main>

<!-- Clue Modal -->
<div class="modal-overlay" id="clue-modal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeClue()">×</button>
    <div class="clue-value" id="modal-val"></div>
    <div class="clue-text" id="modal-clue"></div>
    <div class="question-text" id="modal-question"></div>
    
    <div class="modal-actions">
      <button class="btn" id="reveal-btn" onclick="revealQuestion()">Reveal Answer</button>
      <button class="btn btn-outline" id="clear-buzzer-btn" style="display: none; border-color: #f87171; color: #f87171;" onclick="clearBuzzers()">Clear Buzzers</button>
      <button class="btn btn-outline" onclick="closeClue()">Close</button>
    </div>

    <div class="quick-award" id="quick-award">
      <h4>Award Points (<span id="qa-val"></span>)</h4>
      <div class="qa-players" id="qa-players"></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const state = {
    groups: [
      { id: 'g1', name: 'Group 1' }
    ],
    players: [],
    activeGroupId: null,
    activeBoard: 1, 
    playedTiles: new Set(),
    currentTile: null
  };

  const boardsData = [
    {
      boardNumber: 1,
      title: "Board 1 (100 - 500)",
      categories: [
        {
          name: "WORDS THAT END IN ‘ASM’",
          clues: [
            { val: 100, clue: "This 6-letter word is defined as a climax or peak of intense physical excitement.", answer: "Orgasm" },
            { val: 200, clue: "Watch out for a sudden, involuntary contraction of a muscle with this short 5-letter term.", answer: "Spasm" },
            { val: 300, clue: "Often called the lowest form of wit, this linguistic style uses sharp irony to mock or convey contempt.", answer: "Sarcasm" },
            { val: 400, clue: "This 10-letter word for intense passion or eager interest originally referred to being inspired by a divine force.", answer: "Enthusiasm" },
            { val: 500, clue: "This thick, jelly-like substance fills a cell, surrounding the nucleus and holding all of the internal organelles in place.", answer: "Cytoplasm" }
          ]
        },
        {
          name: "JUNKIE CORE",
          clues: [
            { val: 100, clue: "Extracted from the leaves of a South American shrub, this powerful stimulant was infamously included in the original 19th-century recipe for Coca-Cola.", answer: "Cocaine" },
            { val: 200, clue: "Accidentally discovered by chemist Albert Hofmann in 1938, this powerful psychedelic is commonly known by its three-letter chemical abbreviation.", answer: "LSD" },
            { val: 300, clue: "Originally created as a fast-acting surgical anesthetic, this dissociative drug is also known on the street by its letter-heavy nickname", answer: "Ketamine" },
            { val: 400, clue: "First synthesized in Germany in 1897 and briefly marketed as a non-addictive cough medicine, this potent opioid is a derivative of morphine.", answer: "Heroin" },
            { val: 500, clue: "This highly addictive synthetic stimulant saw widespread military use during World War II to combat fatigue", answer: "Methamphetamines, Speed" }
          ]
        },
        {
          name: "ANAGRAM",
          clues: [
            { val: 100, clue: "Rearrange the letters of the word \"SILENT\" to find this action you should do when someone else is speaking.", answer: "Listen" },
            { val: 200, clue: "If you move the letters around in the word \"DANGER\", you'll find a plot of land where you grow flowers and vegetables.", answer: "Garden" },
            { val: 300, clue: "This title for a scientist who studies the cosmos is a letter-for-letter anagram of \"MOON STARER\".", answer: "Astronomer" },
            { val: 400, clue: "The answer to this question uses the same letters and ALSO equals the same as \"ELEVEN PLUS TWO\".", answer: "Twelve plus One" },
            { val: 500, clue: "In Harry Potter and the Chamber of Secrets, rearranging the letters of \"TOM MARVOLO RIDDLE\" is what that character says in the movie", answer: "I am Lord Voldemort" }
          ]
        },
        {
          name: "MODERN HISTORY",
          clues: [
            { val: 100, clue: "In July 1969, astronaut Neil Armstrong made history by broadcasting his famous words after stepping onto this celestial body.", answer: "Moon" },
            { val: 200, clue: "On December 25, 1991, the red hammer-and-sickle flag was lowered from the Kremlin for the final time, marking the official dissolution of this superpower.", answer: "USSR, Soviet Union" },
            { val: 300, clue: "During the August 1963 March on Washington, this civil rights leader delivered his iconic \"I Have a Dream\" speech from the steps of the Lincoln Memorial.", answer: "Martin Luther King Jr" },
            { val: 400, clue: "This concrete and barbed-wire barrier that divided a major capital city for nearly three decades was famously breached and torn down in November 1989 somewhere in Europe.", answer: "Berlin Wall" },
            { val: 500, clue: "Codenamed \"Trinity,\" the world's first nuclear weapon test was successfully detonated in July 1945 in the desert of this U.S. state.", answer: "New Mexico" }
          ]
        },
        {
          name: "CUISINE GEOGRAPHY",
          clues: [
            { val: 100, clue: "This microfoam-topped espresso beverage known as the flat white was pioneered in cafes in this country during the 1980s.", answer: "Australia" },
            { val: 200, clue: "Chicken tikka masala was actually invented and popularized in the restaurants of this country.", answer: "United Kingdom, Scotland" },
            { val: 300, clue: "The Caesar salad was invented in 1924 by a restaurant owner in this western country", answer: "Mexico" },
            { val: 400, clue: "This flaky pastry known as the croissant is actually named the kipferl of this European country.", answer: "Austria" },
            { val: 500, clue: "A beloved symbol of Scandinavian cooking, Swedish meatballs trace their historical recipe roots back to King Charles XII, who brought the culinary technique home from the Ottoman Empire in this modern-day country.", answer: "Turkey" }
          ]
        }
      ]
    },
    {
      boardNumber: 2,
      title: "Board 2 (200 - 1000)",
      categories: [
        {
          name: "AA MEETING",
          clues: [
            { val: 200, clue: "Primarily made by fermenting crushed grapes, this popular alcoholic beverage includes major red varieties like Merlot and Pinot Noir.", answer: "Wine" },
            { val: 400, clue: "Often referred to as \"rice wine,\" this traditional alcoholic beverage is actually brewed using a unique process involving fermented rice, water, and a specific mold called koji.", answer: "Sake" },
            { val: 600, clue: "What are the main ingredients for a classic Margarita", answer: "Tequila, triple sec (or Cointreau), and lime juice" },
            { val: 800, clue: "This spirit is nicknamed the green fairy", answer: "Absinthe" },
            { val: 1000, clue: "To legally be classified as true bourbon in the United States, a whiskey must be made from a grain mash that is at least this percentage corn.", answer: "51%" }
          ]
        },
        {
          name: "CUDDLY CREATURES",
          clues: [
            { val: 200, clue: "Looking like a giant, soft white stuffed animal roaming the Arctic, this massive apex predator is definitely not built for a hug.", answer: "Polar Bear" },
            { val: 400, clue: "This industrious, chubby swimmer looks like a friendly nature-builder, but it packs massive, self-sharpening orange incisors built to chew through solid timber.", answer: "Beaver" },
            { val: 600, clue: "Looking like a fuzzy little puppy from a distance, this fierce marsupial is famous for its terrifying screeches and a bite force that can easily crush bone.", answer: "Tasmanian Devil" },
            { val: 800, clue: "Resembling a massive, soft plush toy, if you were to shave off this animals fur, the exact same stripe pattern is printed directly onto its skin underneath.", answer: "Tiger" },
            { val: 1000, clue: "Native to the high, arid steppes of Central Asia, this famously flat-faced feline boasts the densest fur of any cat species, giving it the deceptive appearance of a fluffy decorative pillow", answer: "Pallas's Cat" }
          ]
        },
        {
          name: "CENTRAL COAST SUBURBS",
          clues: [
            { val: 200, clue: "This suburb very recently had a shooting.", answer: "Berkley Vale" },
            { val: 400, clue: "I personally spent most of my childhood growing up in this suburb", answer: "Wyoming" },
            { val: 600, clue: "This coastal suburb is known for its famous golf course and that's it", answer: "Magenta Shores" },
            { val: 800, clue: "This suburb is home to the 'Rams' soccer team with a Green and White striped Jersey.", answer: "East Gosford" },
            { val: 1000, clue: "Based on data from the NSW Bureau of Crime Statistics and Research (BOCSAR), These 2 suburbs consistently record the highest per-capita crime rates on the Central Coast", answer: "Wyong, Tuggerah" }
          ]
        },
        {
          name: "MEDICAL TERMS",
          clues: [
            { val: 200, clue: "This common medical suffix attached to the end of a word meaning inflammation", answer: "-itis" },
            { val: 400, clue: "Meaning \"I shall please\" in Latin, this term refers to a harmless, inactive substance given to a patient to test psychological effects or as a mock treatment.", answer: "Placebo" },
            { val: 600, clue: "Derived from the Greek word for fox (due to the way foxes shed their fur in patches), this medical term refers to significant hair loss from the head or body.", answer: "Alopecia" },
            { val: 800, clue: "This common diagnostic procedure involves extracting a small sample of living tissue from the body so it can be examined under a microscope for signs of disease.", answer: "Biopsy" },
            { val: 1000, clue: "Derived from Greek roots meaning \"fast\" and \"heart,\" this clinical term describes a resting heart rate that is abnormally high, typically exceeding 100 beats per minute.", answer: "Tachycardia" }
          ]
        },
        {
          name: "WHO KNOWS NICK BETTER",
          clues: [
            { val: 200, clue: "When is my birthday?", answer: "24th of May 2003" },
            { val: 400, clue: "What is the most recent Video Game that I played", answer: "Roblox" },
            { val: 600, clue: "What is my sisters name?", answer: "Tiarna" },
            { val: 800, clue: "When I was younger, what did I want to be when I grew up", answer: "Marine Biologist" },
            { val: 1000, clue: "How many cars have I owned", answer: "10" }
          ]
        }
      ]
    }
  ];
  
  function init() {
    renderTabs();
    if(state.groups.length > 0) {
      startGame(state.groups[0].id);
    }
  }

  function renderTabs() {
    const nav = document.getElementById('main-nav');
    nav.innerHTML = state.groups.map(g => 
      `<button class="tab active" onclick="startGame('${g.id}')">${g.name}</button>`
    ).join('');
  }

  function switchView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(`view-${viewId}`).classList.add('active');
  }

  // --- ONLINE MULTIPLAYER LOGIC --- //

  function addPlayer(presetName = null) {
    const input = document.getElementById('new-player-input');
    const name = presetName || input.value.trim();
    if(name) {
      const newPlayer = { id: 'p'+Date.now(), name, score: 0 };
      socket.emit('add_player', newPlayer); 
      input.value = '';
    }
  }

  socket.on('update_players', (serverPlayers) => {
    state.players = serverPlayers;
    renderPlayerSetup();
    renderScoreboard();
  });

  socket.on('buzzer_winner', (playerId) => {
    const winner = state.players.find(p => p.id === playerId);
    if (winner) {
      const questionText = document.getElementById('modal-question');
      questionText.style.display = 'block';
      questionText.style.color = '#eab308'; 
      questionText.innerText = `🚨 ${winner.name.toUpperCase()} BUZZED FIRST! 🚨`;
      
      document.getElementById('reveal-btn').style.display = 'none';
      document.getElementById('clear-buzzer-btn').style.display = 'inline-block';
    }
  });

  function clearBuzzers() {
    socket.emit('reset_buzzer'); 
    
    document.getElementById('modal-question').style.display = 'none';
    document.getElementById('clear-buzzer-btn').style.display = 'none';
    document.getElementById('reveal-btn').style.display = 'inline-block';
  }

  // --- STANDARD GAME LOGIC --- //

  function renderPlayerSetup() {
    const list = document.getElementById('player-setup-list');
    list.innerHTML = state.players.map(p => 
      `<div style="display:flex; justify-content:space-between; background: rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 4px;">
        <span>${p.name}</span>
        <button style="background:none;border:none;color:#f87171;cursor:pointer;" onclick="removePlayer('${p.id}')">Remove</button>
      </div>`
    ).join('');
  }

  function removePlayer(id) {
    state.players = state.players.filter(p => p.id !== id);
    renderPlayerSetup();
    renderScoreboard();
    socket.emit('update_scores', state.players); 
  }

  function updateScore(playerId, amount) {
    const player = state.players.find(p => p.id === playerId);
    if(player) {
      player.score += amount;
      renderScoreboard();
      renderQuickAward();
      socket.emit('update_scores', state.players); 
    }
  }

  function renderScoreboard() {
    const html = state.players.map(p => `
      <div class="player-card">
        <div class="player-name">${p.name}</div>
        <div class="player-score" style="color: ${p.score < 0 ? '#f87171' : 'white'}">${p.score}</div>
        <div class="score-controls">
          <button class="score-btn sub" onclick="updateScore('${p.id}', ${state.activeBoard === 1 ? -100 : -200})">-</button>
          <button class="score-btn add" onclick="updateScore('${p.id}', ${state.activeBoard === 1 ? 100 : 200})">+</button>
        </div>
      </div>
    `).join('');
    
    document.getElementById('scoreboard').innerHTML = html;
  }

  function startGame(groupId) {
    state.activeGroupId = groupId;
    state.activeBoard = 1;
    state.playedTiles.clear();
    
    document.getElementById('game-title').innerText = "Jeopardy Game Night";
    updateBoardUI();
    switchView('game');
  }

  function nextBoard() {
    if(state.activeBoard === 1) {
      state.activeBoard = 2;
      updateBoardUI();
    } else {
      endGame();
    }
  }

  function endGame() {
    switchView('end');
    const sorted = [...state.players].sort((a,b) => b.score - a.score);
    const container = document.getElementById('final-scoreboard');
    container.innerHTML = sorted.map((p, i) => `
      <div class="player-card" style="width: 300px; margin: 0.5rem; border-color: ${i===0 ? '#eab308' : 'rgba(255,255,255,0.1)'};">
        <div style="color: ${i===0 ? '#eab308' : 'white'}; font-size: 1.5rem; margin-bottom: 0.5rem;">${i===0 ? '🏆 Winner' : '#'+(i+1)}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-score">${p.score}</div>
      </div>
    `).join('');
  }

  function updateBoardUI() {
    const currentBoard = boardsData[state.activeBoard - 1];
    document.getElementById('game-subtitle').innerText = currentBoard.title;
    document.getElementById('next-board-btn').innerText = state.activeBoard === 1 ? 'Next Board' : 'End Game';
    
    const grid = document.getElementById('jeopardy-grid');
    grid.innerHTML = '';

    currentBoard.categories.forEach(cat => {
      grid.innerHTML += `<div class="category-header">${cat.name}</div>`;
    });

    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 5; col++) {
        const cat = currentBoard.categories[col];
        const clueObj = cat.clues[row];
        const tileId = `b${state.activeBoard}-r${row+1}-c${col}`;
        const isPlayed = state.playedTiles.has(tileId);
        
        grid.innerHTML += `
          <div class="tile ${isPlayed ? 'played' : ''}" 
               id="${tileId}" 
               onclick="!this.classList.contains('played') && openClue('${tileId}', ${col}, ${row})">
            $${clueObj.val}
          </div>
        `;
      }
    }
    renderScoreboard();
  }

  function openClue(tileId, colIndex, rowIndex) {
    const currentBoard = boardsData[state.activeBoard - 1];
    const cat = currentBoard.categories[colIndex];
    const clueObj = cat.clues[rowIndex];
    
    state.currentTile = { id: tileId, val: clueObj.val };
    
    document.getElementById('modal-val').innerText = `${cat.name} - $${clueObj.val}`;
    document.getElementById('modal-clue').innerText = clueObj.clue;
    document.getElementById('modal-question').innerText = `Answer: (${clueObj.answer})`;
    
    document.getElementById('modal-question').style.display = 'none';
    document.getElementById('reveal-btn').style.display = 'inline-block';
    document.getElementById('clear-buzzer-btn').style.display = 'none';
    
    renderQuickAward();
    document.getElementById('quick-award').style.display = 'block';
    
    const modal = document.getElementById('clue-modal');
    modal.classList.add('active');
  }

  function revealQuestion() {
    document.getElementById('modal-question').style.display = 'block';
    document.getElementById('modal-question').style.color = '#4ade80';
    document.getElementById('reveal-btn').style.display = 'none';
    document.getElementById('clear-buzzer-btn').style.display = 'none';
  }

  function closeClue() {
    if(state.currentTile) {
      state.playedTiles.add(state.currentTile.id);
      document.getElementById(state.currentTile.id).classList.add('played');
    }
    document.getElementById('clue-modal').classList.remove('active');
    state.currentTile = null;
    
    socket.emit('reset_buzzer'); 
  }

  function renderQuickAward() {
    if(!state.currentTile) return;
    const val = state.currentTile.val;
    document.getElementById('qa-val').innerText = `$${val}`;
    const container = document.getElementById('qa-players');
    
    container.innerHTML = state.players.map(p => `
      <div style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); text-align: center;">
        <div style="font-weight: 600; margin-bottom: 0.25rem;">${p.name}</div>
        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem;">${p.score}</div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-outline" style="color: #f87171; padding: 0.25rem 0.5rem;" onclick="updateScore('${p.id}', ${-val})">-${val}</button>
          <button class="btn btn-outline" style="color: #4ade80; padding: 0.25rem 0.5rem;" onclick="updateScore('${p.id}', ${val})">+${val}</button>
        </div>
      </div>
    `).join('');
  }

  init();
</script>
</body>
</html>
